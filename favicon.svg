<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Définitions des couleurs et effets -->
  <defs>
    <!-- Dégradé Bleu Médical / Turquoise (Santé & Technologie) -->
    <linearGradient id="medicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" /> <!-- Cyan -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Bleu chirurgical -->
    </linearGradient>

    <!-- Ombre subtile pour donner de la profondeur -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fond blanc arrondi style App / Univers médical propre -->
  <rect width="200" height="200" rx="45" fill="#ffffff" stroke="#f1f5f9" stroke-width="2"/>

  <!-- GROUPE CENTRAL (Croix Médicale + Objectif Caméra) -->
  <g transform="translate(100, 100)" filter="url(#dropShadow)">
    
    <!-- STRUCTURE DE LA CROIX MÉDICALE (Formée par des arcs de cercle high-tech) -->
    <!-- Branche Haute -->
    <path d="M -15,-55 C -15,-65 15,-65 15,-55 L 15,-25 L -15,-25 Z" fill="url(#medicGrad)" />
    <!-- Branche Basse -->
    <path d="M -15,55 C -15,65 15,65 15,55 L 15,25 L -15,25 Z" fill="url(#medicGrad)" />
    <!-- Branche Gauche -->
    <path d="M -55,-15 C -65,-15 -65,15 -55,15 L -25,15 L -25,-15 Z" fill="url(#medicGrad)" />
    <!-- Branche Droite -->
    <path d="M 55,-15 C 65,-15 65,15 55,15 L 25,15 L 25,-15 Z" fill="url(#medicGrad)" />

    <!-- L'OBJECTIF DE LA CAMÉRA (Au centre de la croix) -->
    <!-- Cercle extérieur de la lentille -->
    <circle cx="0" cy="0" r="30" fill="#0f172a" />
    
    <!-- Diaphragme de la caméra (Lames stylisées) -->
    <path d="M -15,-15 L 5,-22 L -5,-5 Z" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
    <path d="M 15,-15 L 22,5 L 5,-5 Z" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
    <path d="M 15,15 L -5,22 L 5,5 Z" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
    <path d="M -15,15 L -22,-5 L -5,5 Z" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />

    <!-- Lentille centrale / Reflet de l'objectif (Cam) -->
    <circle cx="0" cy="0" r="14" fill="#0f172a" />
    <!-- Point de reflet lumineux -->
    <circle cx="-5" cy="-5" r="4" fill="#ffffff" opacity="0.9" />
    <circle cx="4" cy="4" r="1.5" fill="#ffffff" opacity="0.6" />
    
  </g>

  <!-- Petites ondes de signal vidéo / capteur discret -->
  <path d="M 150,40 A 15,15 0 0,1 165,55" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 150,30 A 25,25 0 0,1 175,55" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.4" />
</svg>
